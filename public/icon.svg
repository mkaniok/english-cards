<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="90" cy="420" r="120" fill="#fff" opacity=".07"/>
  <circle cx="440" cy="70" r="90" fill="#fff" opacity=".07"/>
  <!-- back card -->
  <g transform="rotate(-14 236 270)" filter="url(#sh)">
    <rect x="128" y="132" width="216" height="276" rx="34" fill="url(#back)"/>
  </g>
  <!-- front card -->
  <g transform="rotate(7 276 262)" filter="url(#sh)">
    <rect x="168" y="118" width="216" height="276" rx="34" fill="#fff"/>
    <text x="276" y="292" font-family="Nunito, Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" font-size="132" text-anchor="middle" fill="#6d28d9">Aa</text>
    <rect x="216" y="326" width="120" height="16" rx="8" fill="#ddd6fe"/>
  </g>
  <!-- sparkle -->
  <path d="M408 132 L420 168 L456 180 L420 192 L408 228 L396 192 L360 180 L396 168 Z" fill="#fde047" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
</svg>
